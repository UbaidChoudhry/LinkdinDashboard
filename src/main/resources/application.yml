spring:
  application:
    name: jobdash
  datasource:
    url: jdbc:sqlite:./data/jobdash.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# SQLite pragmas (WAL mode) are applied on connection via the datasource init below.

sweep:
  pacing:
    min-delay: 6s
    max-delay: 12s
  budget:
    per-run: 150
    per-rolling-day: 300
    test-mode-page-cap: 3
  breaker:
    open-duration: 30m
    max-open-duration: 60m
    soft-failure-threshold: 2
  shards:
    - "New York City Metropolitan Area"
    - "Los Angeles Metropolitan Area"
    - "Seattle, Washington, United States"
    - "Austin, Texas Metropolitan Area"

salary:
  enabled: true
  cache-ttl: 90d
  max-data-age: 1095d
  pacing:
    min-delay: 1s
  # Free-tier ceilings, verified 2026-09-06. Both windows are enforced (see SalaryRateLimiter):
  #   adzuna   - free tier is a MONTHLY allowance of ~1000 calls, so the monthly cap is the
  #              real constraint; the daily cap just stops one run eating the whole month.
  #   h1bapi   - free tier is 20 requests/day (last 2 fiscal years). No monthly limit published,
  #              so 0 = unlimited there. Do not raise this above 20 without a paid plan.
  daily-cap:
    adzuna: 40
    h1bapi: 20
  monthly-cap:
    adzuna: 900
    h1bapi: 0
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
  h1b-api:
    api-key: ${H1BAPI_KEY:}
  lca:
    # Set ONLY by ./import-lca.sh, as a command-line argument. A single .xlsx or a directory of
    # them; blank on a normal boot. Deliberately not wired to an env var: a stray value in .env
    # would make ./run.sh import-and-exit instead of starting the server.
    import-path: ""
    # Spreadsheets are ~80MB and useless once aggregated into lca_wage, so they are removed
    # after a successful import. Only a file that actually contributed rows is ever deleted.
    delete-after-import: ${LCA_DELETE_AFTER_IMPORT:true}
