spring:
  application:
    name: jobdash
  datasource:
    url: jdbc:sqlite:./data/jobdash.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# SQLite pragmas (WAL mode) are applied on connection via the datasource init below.

sweep:
  pacing:
    min-delay: 6s
    max-delay: 12s
  # One request = one search page OR one job-detail fetch; both count here, because both hit
  # the same host from the same IP. Sized 2026-09-09 so one sweep can fetch a description for
  # EVERY passing job it finds (a 24h US sweep: ~50 search pages + ~330 details), plus a second
  # run the same day. This is well above the 200-300/day the original spec assumed was safe;
  # the pacing (6-12s) and the circuit breaker are what keep it survivable - if LinkedIn does
  # block, the breaker opens and the run pauses rather than hammering on.
  budget:
    per-run: 500
    per-rolling-day: 1000
    test-mode-page-cap: 3
  # After collection, a LinkedIn run fetches the guest detail fragment for every passing,
  # untriaged row that has never had one - newest first, across all runs, so anything a
  # previous run left behind is picked up too. Each is one paced request out of the budget
  # above. max-per-run: 0 means no cap beyond that budget. A row is fetched once, ever.
  detail:
    enabled: true
    max-per-run: 0
  breaker:
    open-duration: 30m
    max-open-duration: 60m
    soft-failure-threshold: 2
  shards:
    - "New York City Metropolitan Area"
    - "Los Angeles Metropolitan Area"
    - "Seattle, Washington, United States"
    - "Austin, Texas Metropolitan Area"

salary:
  enabled: true
  cache-ttl: 90d
  max-data-age: 1095d
  pacing:
    min-delay: 1s
  # Free-tier ceilings, verified 2026-09-06. Both windows are enforced (see SalaryRateLimiter):
  #   adzuna   - free tier is a MONTHLY allowance of ~1000 calls, so the monthly cap is the
  #              real constraint; the daily cap just stops one run eating the whole month.
  #   h1bapi   - free tier is 20 requests/day (last 2 fiscal years). No monthly limit published,
  #              so 0 = unlimited there. Do not raise this above 20 without a paid plan.
  daily-cap:
    adzuna: 40
    h1bapi: 20
  monthly-cap:
    adzuna: 900
    h1bapi: 0
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
  h1b-api:
    api-key: ${H1BAPI_KEY:}
  lca:
    # Set ONLY by ./import-lca.sh, as a command-line argument. A single .xlsx or a directory of
    # them; blank on a normal boot. Deliberately not wired to an env var: a stray value in .env
    # would make ./run.sh import-and-exit instead of starting the server.
    import-path: ""
    # Spreadsheets are ~80MB and useless once aggregated into lca_wage, so they are removed
    # after a successful import. Only a file that actually contributed rows is ever deleted.
    delete-after-import: ${LCA_DELETE_AFTER_IMPORT:true}

# ATS job boards (Greenhouse / Lever / Workday). These are public, documented JSON APIs and are
# NOT subject to the LinkedIn budget above - they are counted separately in external_request_log
# by AtsRateLimiter. Never conflate the two (see HANDOFF.md §8).
ats:
  enabled: true
  pacing:
    min-delay: 250ms
  # Guard rails. The imported slug catalog holds >15,000 companies; a run only ever visits
  # companies with enabled=1, and these caps bound even that.
  max-companies-per-run: 150
  # Greenhouse and Lever return every posting for a company in ONE request. Workday does not:
  # its search page carries no description and only a relative "Posted 30+ Days Ago", so each
  # kept job costs an extra detail request. This caps that second phase.
  workday:
    max-details-per-run: 120
    page-size: 20
  daily-cap:
    greenhouse: 2000
    lever: 2000
    workday: 3000
  # A company whose board 404s this many runs in a row is marked dead and skipped from then on.
  dead-slug-threshold: 2
  # Largest board payload we will read. Palantir's Lever board is ~6MB and Veeva's ~12MB.
  max-response-bytes: 33554432
  slugs:
    # Set ONLY by ./import-slugs.sh, as a command-line argument (a file path or a URL).
    # Deliberately not wired to an env var: a stray value in .env would make ./run.sh
    # import-and-exit instead of starting the server - same rule as salary.lca.import-path.
    import-path: ""
    prune-dead: false

# Resume/job matching via the Claude CLI. Uses the local `claude` binary and your Claude
# subscription - no API key and no API credits are involved.
ai:
  enabled: true
  cli-path: ${CLAUDE_CLI_PATH:claude}
  model: sonnet
  # Fixed per-invocation overhead is ~25k tokens regardless of payload, so batching is the
  # dominant cost lever - see HANDOFF.md §9.
  batch-size: 9
  concurrency: 3
  timeout: 5m
  # Job descriptions are truncated to this many characters before being sent.
  max-description-chars: 6000
  # Whether Claude judges each posting's location and non-US ones are hidden. Turning this off
  # leaves every row unclassified and therefore visible.
  us-only: true
  # Distinct location strings sent per classification call. They are tiny (a few words each), so
  # this can be large - 73 strings fitted comfortably in one call. Bigger batch = fewer
  # invocations = lower cost, since the ~25k-token per-invocation overhead dwarfs the payload.
  location-batch-size: 200

# "Apply with Claude": drives the local `claude` CLI with the Claude-in-Chrome extension to fill
# (and optionally submit) job application forms. See apply/ApplyOrchestrator.
apply:
  enabled: true
  # Same model as ai.model - kept separate so cost/quality can be tuned independently per feature.
  model: sonnet
  # Per-job ceiling: one browser-driven application (open tab, find form, fill fields, upload
  # resume, review/submit) takes much longer than a text-only scan call.
  timeout: 10m
  # Upper bound on browser actions (tool calls) Claude may take filling out one application -
  # guards against an unresponsive page looping the agent indefinitely. A real Greenhouse form
  # with education, EEO, and custom questions took ~60 actions to get two-thirds through; 150
  # leaves headroom to actually finish one.
  max-turns: 150
  # Per-job cost ceiling passed to the CLI's own --max-budget-usd, so a single stuck application
  # can't run away; the batch's own summary sums the CLI-reported cost per job, never estimated.
  # Must cover that many actions, so it's raised alongside max-turns above.
  max-budget-usd: 4.0
  # Job descriptions are truncated to this many characters before being sent to the CLI.
  max-description-chars: 4000
  # A job with no CLI event for this long is killed and marked failed - e.g. a native OS file
  # dialog has frozen the page.
  idle-timeout: 3m
  # Per-job stream-json transcripts (live observability + resumable sessions) are written here.
  transcript-dir: logs/apply
  # Passed as --effort. Each browser action is a model turn, so per-turn thinking is a large
  # share of an application's wall clock; medium keeps form-filling judgment, low is faster.
  effort: medium

  # LinkedIn->ATS matcher: after every scan, cross-references each recommended LinkedIn posting
  # against the company's own Greenhouse/Lever/Workday board so "Apply with Claude" can bypass
  # LinkedIn entirely. The board requests this makes are public JSON, counted against the ATS
  # daily caps in external_request_log - never against LinkedIn's own budget/breaker.
  linkedin-links:
    # After the AI scan, the recommended LinkedIn postings are opened in the user's Chrome -
    # which must be signed in to a BURNER LinkedIn account, never the real one (HANDOFF.md §2,
    # §13) - and each Apply button's external destination is read from the page. Nothing is
    # ever applied to, clicked through, or changed; Easy Apply postings have no destination.
    enabled: true
    # Postings per `claude -p --chrome` call. The fixed ~25k-token overhead per call dominates
    # (≈ $0.15 for a single posting), so batching is the cost lever.
    batch-size: 8
    # Hard cap on postings resolved in one run; the rest are noted and retried next run.
    max-per-run: 40
    max-turns: 120
    max-budget-usd: 2.0
    timeout: 10m
